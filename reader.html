<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Writeup — DaUmega</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="readerContent" class="reader">Loading&hellip;</div>

  <script src="parser.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const file = params.get("file");
    const container = document.getElementById("readerContent");

    if (!file) {
      container.innerHTML = `<a class="back-link" href="writeups.html">&larr; Writeups</a><p>No writeup specified.</p>`;
    } else {
      fetch(file)
        .then(r => { if (!r.ok) throw new Error(); return r.text(); })
        .then(raw => renderWriteup(container, parseWriteup(raw)))
        .catch(() => {
          container.innerHTML = `<a class="back-link" href="writeups.html">&larr; Writeups</a><p>Couldn't load that writeup.</p>`;
        });
    }
  </script>
</body>
</html>
