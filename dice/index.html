<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Roller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="page-header">
    <button id="goBackBtn">&#8592; Back</button>
    <h1>Dice Roller</h1>
    <p class="sub">Add dice below. Click a die to hold it; click it again to remove it. Roll skips held dice.</p>
  </div>

  <div class="addbar" id="addBar"></div>

  <div class="custombar">
    <label for="customSides">Custom die:</label>
    <span class="d-prefix">d</span><input id="customSides" type="number" min="2" max="10000" step="1" placeholder="7" inputmode="numeric" aria-label="Custom die sides">
    <button id="addCustomBtn" class="addbtn">Add die</button>
    <span class="hint">Any sides, 2-10000.</span>
  </div>

  <div class="pool" id="pool"></div>

  <div class="controls">
    <button id="rollBtn" class="primary">Roll</button>
    <button id="clearBtn">Clear</button>
    <span class="total" id="total"></span>
    <label class="mod">Modifier <input id="mod" type="number" min="-1000" max="1000" step="1" placeholder="0" inputmode="numeric" aria-label="Modifier to total" title="Optional: added to the total, e.g. +5 or -2. Leave at 0 to ignore it."></label>
    <span class="rolls" id="rolls">Rolls: 0</span>
    <button id="resetRollsBtn">Reset rolls</button>
    <label class="limit">Max rolls <input id="rollLimit" type="number" min="1" max="99" step="1" placeholder="&infin;" inputmode="numeric" aria-label="Maximum rolls" title="Optional: maximum rolls. Leave blank for unlimited."></label>
  </div>
  <p class="help">Modifier is optional, it adds to the total. Max rolls is optional, leave it blank for unlimited rolls.</p>
  <p class="status" id="status"></p>

  <script src="script.js" defer></script>
</body>
</html>
